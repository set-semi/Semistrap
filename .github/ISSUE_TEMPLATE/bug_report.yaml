name: Bug Report
description: Report a problem you're having
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > If your problem keeps happening, it can typically be fixed by [reinstalling](https://semistrap.vercel.app).
        ### **Instructions**
        - Before you open this report, please [check the Wiki first](https://semistrap.vercel.app). Most common problems will be addressed here.
        - Make sure you are using the [latest version of Semistrap](https://github.com/set-semi/Semistrap/releases/latest). Your report won't be valid if you aren't.
        - Your report will be closed if it's lazily made and has too little detail.
  - type: checkboxes
    id: terms
    attributes:
      label: I have...
      options:
        - label: I have read the instructions, and I didn't find a solution in any of the links above.
          required: true
        - label: I am using the latest version of Semistrap.
          required: true
  - type: input
    id: version
    attributes:
      label: Semistrap Version
      description: "What version of Semistrap are you using? Find it in the 'About' section of the Settings"
      placeholder: "v1.0.0 (for example)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What problem did you encounter?
      description: Provide a good description of the problem you're having. Screenshots too please.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: How do you reproduce the problem?
      description: Write down steps to cause the problem, from start to finish, if you can.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
  - type: textarea
    id: log
    attributes:
      label: Semistrap Log
      description: If you're getting a 'Semistrap Exception' error, upload your log file here. Open it, then select all (Ctrl+A), then copy and paste here. Otherwise, leave it empty.
      value: "N/A"
      render: text
